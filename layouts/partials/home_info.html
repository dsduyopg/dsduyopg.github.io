{{- with site.Params.homeInfoParams }}
<article class="first-entry home-info hero-banner">
  <img class="hero-banner-img" src="{{ "images/hero.jpg" | relURL }}" alt="博客横幅" />
  <div class="hero-banner-overlay"></div>
  <div class="hero-banner-content">
    <header class="entry-header">
      <h1>{{ .Title | markdownify }}</h1>
    </header>
    <div class="entry-content md-content">
      {{ $opts := dict "display" "block" }}
      {{ .Content | $.Page.RenderString $opts }}
    </div>
    <div class="hero-links">
      <a class="hero-link" href="/search/">搜索</a>
      <a class="hero-link" href="/archives/">归档</a>
      <a class="hero-link" href="/tags/">标签</a>
      <a class="hero-link" href="/about/">关于</a>
    </div>
    <footer class="entry-footer">
      {{ partial "social_icons.html" (dict "align" site.Params.homeInfoParams.AlignSocialIconsTo) }}
    </footer>
  </div>
</article>
{{- end -}}
