{{- if not (.Param "hideComments") }}
<div class="comments">
  <h2>评论</h2>
  <div class="like-box">
    <button class="like-btn" type="button" id="cf-like-btn" title="点赞">
      <span class="like-heart">♡</span>
      <span class="like-count">0</span>
    </button>
  </div>
  <div class="giscus" id="giscus-container"></div>
  <script src="https://giscus.app/client.js"
          data-repo="dsduyopg/dsduyopg.github.io"
          data-repo-id="R_kgDOT78MPw"
          data-category="General"
          data-category-id="DIC_kwDOT78MP84DEF4E"
          data-mapping='{{ .Param "giscusMapping" | default "pathname" }}'
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="bottom"
          data-theme="preferred_color_scheme"
          data-lang="zh-CN"
          crossorigin="anonymous"
          async>
  </script>

  {{/* ===== CF 自建评论区（匿名 + GitHub 轻量登录，免登录提交，Turnstile 防机器人） ===== */}}
  <hr>
  <div class="cf-comments" id="cf-comments">
    <h3>CF 评论区（免登录）</h3>
    <p class="cf-hint">填个昵称就能发，不用注册。也可用 GitHub 登录自动填昵称。</p>
    <div class="cf-login-row">
      <button type="button" id="cf-gh-login" class="cf-gh-btn">用 GitHub 登录</button>
      <span id="cf-login-status" class="cf-login-status"></span>
    </div>
    <div class="cf-form">
      <input type="text" id="cf-author" maxlength="40" placeholder="昵称（默认：匿名）" class="cf-author">
      <textarea id="cf-body" maxlength="2000" placeholder="说点什么…（≤2000字）" class="cf-body"></textarea>
      <div class="cf-turnstile" id="cf-turnstile"></div>
      <div class="cf-submit-row">
        <button type="button" id="cf-submit" class="cf-submit-btn">提交评论</button>
        <span id="cf-msg" class="cf-msg"></span>
      </div>
    </div>
    <div class="cf-list" id="cf-list">
      <p class="cf-loading">加载评论中…</p>
    </div>
  </div>
  {{/* Turnstile 脚本（必须加载，提交时取 token） */}}
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <noscript>请启用 JavaScript 查看评论。</noscript>
</div>
{{- end }}

<script>
  (function () {
    // ===== 配置 =====
    // 部署 Worker 后把下面这个地址换成你的真实地址:
    // https://你的worker名.你的子域.workers.dev/api/like
    var API_BASE = 'https://blog-like.629017960.workers.dev/api/like';
    // ================

    var btn = document.getElementById('cf-like-btn');
    if (!btn) return;
    var heart = btn.querySelector('.like-heart');
    var num = btn.querySelector('.like-count');
    var path = location.pathname;
    var liked = false;

    function setCount(n) {
      num.textContent = n;
      heart.textContent = liked ? '♥' : '♡';
      btn.classList.toggle('liked', liked);
    }

    // 读取当前文章的点赞数（匿名，无需登录）
    function loadCount() {
      fetch(API_BASE + '?path=' + encodeURIComponent(path))
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (typeof d.count === 'number') {
            liked = !!d.liked;
            setCount(d.count);
          }
        })
        .catch(function () {});
    }

    // 点赞：调用 Worker，防刷（同一 IP 限一次）
    btn.addEventListener('click', function () {
      fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: path })
      })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (typeof d.count === 'number') {
            liked = !!d.liked;
            setCount(d.count);
          }
          if (d.already) {
            alert('你已经点过赞啦 ♥');
          }
        })
        .catch(function () {
          alert('点赞失败，请稍后再试');
        });
    });

    loadCount();
  })();
</script>

{{/* ===== CF 评论区前端逻辑 ===== */}}
<script>
(function () {
  var API = 'https://blog-comments.629017960.workers.dev/api/comments';
  var TURNSTILE_SITE_KEY = '0x4AAAAAAEbQyomn8vBPNjw4'; // 部署后替换为真实 site key
  var GH_CLIENT_ID = 'YOUR_GITHUB_CLIENT_ID';          // 部署前替换为 GitHub OAuth App 的 Client ID
  var slug = location.pathname;
  var listEl = document.getElementById('cf-list');
  var authorEl = document.getElementById('cf-author');
  var bodyEl = document.getElementById('cf-body');
  var msgEl = document.getElementById('cf-msg');
  var submitBtn = document.getElementById('cf-submit');
  var loginBtn = document.getElementById('cf-gh-login');
  var loginStatus = document.getElementById('cf-login-status');

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtTime(ts) {
    var d = new Date(ts);
    if (isNaN(d)) return '';
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function loadComments() {
    fetch(API + '?slug=' + encodeURIComponent(slug))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.comments || !d.comments.length) {
          listEl.innerHTML = '<p class="cf-empty">还没有评论，来抢沙发～</p>';
          return;
        }
        var html = '';
        d.comments.forEach(function (c) {
          html += '<div class="cf-item">'
            + '<div class="cf-meta"><b>' + escapeHtml(c.author) + '</b> <span>' + fmtTime(c.created_at) + '</span></div>'
            + '<div class="cf-text">' + escapeHtml(c.body).replace(/\n/g, '<br>') + '</div>'
            + '</div>';
        });
        listEl.innerHTML = html;
      })
      .catch(function () { listEl.innerHTML = '<p class="cf-empty">评论加载失败</p>'; });
  }

  function showMsg(text, isErr) {
    msgEl.textContent = text;
    msgEl.style.color = isErr ? '#e74c3c' : '#27ae60';
  }

  // 渲染 Turnstile 组件（成功回调把 token 存到全局变量）
  window._cfTurnstileToken = '';
  function renderTurnstile() {
    if (!window.turnstile || typeof window.turnstile.render !== 'function') {
      setTimeout(renderTurnstile, 300);
      return;
    }
    window.turnstile.render('#cf-turnstile', {
      sitekey: TURNSTILE_SITE_KEY,
      callback: function (token) { window._cfTurnstileToken = token; },
      'expired-callback': function () { window._cfTurnstileToken = ''; },
      'error-callback': function () { window._cfTurnstileToken = ''; }
    });
  }
  renderTurnstile();

  submitBtn.addEventListener('click', function () {
    var body = bodyEl.value.trim();
    if (!body) { showMsg('评论内容不能为空', true); return; }
    showMsg('提交中…', false);

    // 取 Turnstile token（渲染组件回调写入）
    var token = window._cfTurnstileToken || '';

    fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        slug: slug,
        author: authorEl.value.trim() || '匿名',
        body: body,
        'cf-turnstile-response': token
      })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (res.ok && res.d.ok) {
          bodyEl.value = '';
          window._cfTurnstileToken = '';
          showMsg('评论成功！', false);
          if (window.turnstile) window.turnstile.reset();
          loadComments();
        } else {
          showMsg(res.d.error || '提交失败', true);
          if (window.turnstile) window.turnstile.reset();
        }
      })
      .catch(function () { showMsg('网络错误，请重试', true); });
  });

  // GitHub 轻量登录：OAuth 弹窗拿用户名，自动填昵称
  loginBtn.addEventListener('click', function () {
    if (GH_CLIENT_ID === 'YOUR_GITHUB_CLIENT_ID') {
      loginStatus.textContent = '（未配置 GitHub Client ID）';
      return;
    }
    var redirect = location.origin + location.pathname;
    var url = 'https://github.com/login/oauth/authorize?client_id=' + GH_CLIENT_ID
      + '&redirect_uri=' + encodeURIComponent(redirect)
      + '&scope=read:user';
    var popup = window.open(url, 'ghlogin', 'width=600,height=700');
    if (!popup) { loginStatus.textContent = '弹窗被拦截，请允许后重试'; return; }
    loginStatus.textContent = '等待 GitHub 授权…';

    // 监听回调（回调页需把 ?code= 通过 postMessage 发回来，或此处轮询）
    var timer = setInterval(function () {
      try {
        if (popup.closed) {
          clearInterval(timer);
          loginStatus.textContent = '未获取到授权';
        }
      } catch (e) {}
    }, 1000);
    window.addEventListener('message', function (ev) {
      if (ev.origin !== location.origin) return;
      if (ev.data && ev.data.ghUser) {
        authorEl.value = ev.data.ghUser;
        loginStatus.textContent = '已登录：' + ev.data.ghUser;
        clearInterval(timer);
        if (popup) popup.close();
      }
    });
  });

  loadComments();
})();
</script>
