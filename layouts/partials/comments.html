{{- if not (.Param "hideComments") }}
<div class="comments">
  <h2>评论</h2>
  <div class="like-box">
    <button class="like-btn" type="button" id="cf-like-btn" title="点赞">
      <span class="like-heart">♡</span>
      <span class="like-count">0</span>
    </button>
  </div>
  <div class="giscus" id="giscus-container"></div>
  <script src="https://giscus.app/client.js"
          data-repo="dsduyopg/dsduyopg.github.io"
          data-repo-id="R_kgDOT78MPw"
          data-category="General"
          data-category-id="DIC_kwDOT78MP84DEF4E"
          data-mapping='{{ .Param "giscusMapping" | default "pathname" }}'
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="bottom"
          data-theme="preferred_color_scheme"
          data-lang="zh-CN"
          crossorigin="anonymous"
          async>
  </script>

  {{/* ===== CF 自建评论区（优雅版） ===== */}}
  <section class="cf-comments" id="cf-comments">
    <header class="cf-comments__head">
      <h3>留言</h3>
      <p class="cf-comments__sub">无需注册，留个名字即可。理性发言，彼此尊重。</p>
    </header>

    {{/* 登录态（GitHub 轻量登录，可选） */}}
    <div class="cf-login" id="cf-login" hidden>
      <span class="cf-login__avatar" id="cf-login-avatar">G</span>
      <span class="cf-login__name" id="cf-login-name"></span>
      <button type="button" class="cf-login__out" id="cf-login-out">退出</button>
    </div>

    {{/* 输入卡片 */}}
    <form class="cf-card" id="cf-form" autocomplete="off">
      <input type="text" id="cf-author" class="cf-input cf-input--author"
             maxlength="40" placeholder="你的昵称（留空则显示「匿名」）">
      <textarea id="cf-body" class="cf-input cf-input--body"
                maxlength="2000" placeholder="写下你的想法…" rows="3"></textarea>
      <div class="cf-card__foot">
        <div class="cf-turnstile" id="cf-turnstile" title="人机验证"></div>
        <div class="cf-card__actions">
          <span class="cf-msg" id="cf-msg"></span>
          <button type="submit" class="cf-submit" id="cf-submit">发布</button>
        </div>
      </div>
    </form>

    {{/* 评论列表 */}}
    <div class="cf-list" id="cf-list">
      <p class="cf-list__loading">正在载入留言…</p>
    </div>
  </section>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <noscript>请启用 JavaScript 以查看与发表留言。</noscript>
</div>

<style>
  /* ---------- CF 评论区：优雅风 ---------- */
  .cf-comments {
    margin-top: var(--content-gap);
    padding-top: var(--content-gap);
    border-top: 1px solid var(--border);
    color: var(--content);
    font-size: 15px;
    line-height: 1.7;
  }
  .cf-comments__head h3 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--primary);
    letter-spacing: .02em;
  }
  .cf-comments__sub {
    margin: .35rem 0 1.1rem;
    color: var(--secondary);
    font-size: .85rem;
  }

  /* 登录态 */
  .cf-login {
    display: flex;
    align-items: center;
    gap: .6rem;
    margin-bottom: 1rem;
    padding: .5rem .75rem;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: .9rem;
  }
  .cf-login[hidden] { display: none; }
  .cf-login__avatar {
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--primary);
    color: var(--theme);
    font-size: .8rem; font-weight: 700;
  }
  .cf-login__name { color: var(--primary); font-weight: 600; }
  .cf-login__out {
    margin-left: auto;
    background: none; border: none; cursor: pointer;
    color: var(--secondary); font-size: .8rem;
    text-decoration: underline;
  }

  /* 输入卡片 */
  .cf-card {
    background: var(--entry);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .cf-card:focus-within {
    border-color: var(--tertiary);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--tertiary) 35%, transparent);
  }
  .cf-input {
    width: 100%;
    border: none;
    background: transparent;
    color: var(--content);
    font: inherit;
    outline: none;
    resize: vertical;
  }
  .cf-input--author {
    padding: .2rem 0 .55rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: .6rem;
    font-weight: 500;
  }
  .cf-input--author::placeholder { color: var(--secondary); font-weight: 400; }
  .cf-input--body {
    min-height: 64px;
    line-height: 1.7;
  }
  .cf-input--body::placeholder { color: var(--secondary); }

  .cf-card__foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-top: .9rem;
    flex-wrap: wrap;
  }
  .cf-card__actions {
    display: flex;
    align-items: center;
    gap: .75rem;
    margin-left: auto;
  }
  .cf-submit {
    border: none;
    background: var(--primary);
    color: var(--theme);
    font: inherit;
    font-weight: 600;
    padding: .5rem 1.4rem;
    border-radius: 999px;
    cursor: pointer;
    transition: opacity .2s ease, transform .1s ease;
  }
  .cf-submit:hover { opacity: .88; }
  .cf-submit:active { transform: translateY(1px); }
  .cf-msg {
    font-size: .82rem;
    color: var(--secondary);
    min-height: 1em;
  }
  .cf-msg.is-err { color: #e5484d; }
  .cf-msg.is-ok  { color: #2e9e5b; }

  /* 列表 */
  .cf-list {
    margin-top: 1.4rem;
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
  }
  .cf-item {
    position: relative;
    padding-left: .95rem;
    border-left: 2px solid var(--border);
  }
  .cf-item__meta {
    display: flex;
    align-items: baseline;
    gap: .6rem;
    margin-bottom: .2rem;
  }
  .cf-item__author {
    color: var(--primary);
    font-weight: 600;
    font-size: .92rem;
  }
  .cf-del {
    margin-left: auto;
    background: none;
    border: 1px solid var(--border);
    color: var(--secondary);
    font-size: .72rem;
    padding: .1rem .55rem;
    border-radius: 999px;
    cursor: pointer;
    opacity: .65;
    transition: color .15s ease, border-color .15s ease, opacity .15s ease;
  }
  .cf-del:hover {
    color: #e5484d;
    border-color: #e5484d;
    opacity: 1;
  }
  .cf-item__time {
    color: var(--secondary);
    font-size: .76rem;
  }
  .cf-item__text {
    color: var(--content);
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0;
  }
  .cf-empty, .cf-list__loading {
    color: var(--secondary);
    font-size: .9rem;
    text-align: center;
    padding: 1.5rem 0;
    margin: 0;
  }

  /* 响应式 */
  @media (max-width: 600px) {
    .cf-card__foot { flex-direction: column; align-items: stretch; }
    .cf-card__actions { margin-left: 0; justify-content: flex-end; }
  }
</style>
{{- end }}

<script>
  (function () {
    // ===== 点赞（CF Worker） =====
    var API_BASE = 'https://blog-like.629017960.workers.dev/api/like';
    var btn = document.getElementById('cf-like-btn');
    if (btn) {
      var heart = btn.querySelector('.like-heart');
      var num = btn.querySelector('.like-count');
      var path = location.pathname;
      var liked = false;
      function setCount(n) {
        num.textContent = n;
        heart.textContent = liked ? '♥' : '♡';
        btn.classList.toggle('liked', liked);
      }
      function loadCount() {
        fetch(API_BASE + '?path=' + encodeURIComponent(path))
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (typeof d.count === 'number') { liked = !!d.liked; setCount(d.count); }
          }).catch(function () {});
      }
      btn.addEventListener('click', function () {
        fetch(API_BASE, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: path })
        })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (typeof d.count === 'number') { liked = !!d.liked; setCount(d.count); }
            if (d.already) alert('你已经点过赞啦 ♥');
          })
          .catch(function () { alert('点赞失败，请稍后再试'); });
      });
      loadCount();
    }
  })();
</script>

{{/* ===== CF 评论区逻辑 ===== */}}
<script>
(function () {
  var API = 'https://blog-comments.629017960.workers.dev/api/comments';
  var TURNSTILE_SITE_KEY = '0x4AAAAAAEbQyomn8vBPNjw4';
  var GH_CLIENT_ID = 'YOUR_GITHUB_CLIENT_ID';
  var slug = location.pathname;

  var listEl   = document.getElementById('cf-list');
  var formEl   = document.getElementById('cf-form');
  var authorEl = document.getElementById('cf-author');
  var bodyEl   = document.getElementById('cf-body');
  var msgEl    = document.getElementById('cf-msg');
  var loginBox = document.getElementById('cf-login');
  var loginName = document.getElementById('cf-login-name');
  var loginOut = document.getElementById('cf-login-out');

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtTime(ts) {
    var d = new Date(Number(ts));
    if (isNaN(d)) return '';
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
         + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function showMsg(text, kind) {
    msgEl.textContent = text;
    msgEl.className = 'cf-msg' + (kind ? ' is-' + kind : '');
  }

  // 博主删除（密码仅缓存在本次会话，不持久化）
  var _adminToken = sessionStorage.getItem('cf_admin_token') || '';
  function deleteComment(id) {
    if (!confirm('确定删除这条留言？此操作不可撤销。')) return;
    var token = _adminToken;
    if (!token) {
      token = prompt('请输入博主管理密码：');
      if (token === null) return;
    }
    fetch(API, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: Number(id), adminToken: token })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (res.ok && res.d.ok) {
          if (!_adminToken) { _adminToken = token; try { sessionStorage.setItem('cf_admin_token', token); } catch (e) {} }
          showMsg('已删除 ✓', 'ok');
          setTimeout(function () { showMsg('', ''); }, 2000);
          loadComments();
        } else {
          showMsg(res.d.error || '删除失败', 'err');
          if (res.d.error && res.d.error.indexOf('密码') >= 0) { _adminToken = ''; try { sessionStorage.removeItem('cf_admin_token'); } catch (e) {} }
        }
      })
      .catch(function () { showMsg('网络异常，删除失败', 'err'); });
  }

  function loadComments() {
    fetch(API + '?slug=' + encodeURIComponent(slug))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.comments || !d.comments.length) {
          listEl.innerHTML = '<p class="cf-empty">还没有留言，来做第一个吧。</p>';
          return;
        }
        listEl.innerHTML = d.comments.map(function (c) {
          return '<div class="cf-item" data-id="' + c.id + '">'
            + '<div class="cf-item__meta">'
            +   '<span class="cf-item__author">' + escapeHtml(c.author) + '</span>'
            +   '<span class="cf-item__time">' + fmtTime(c.created_at) + '</span>'
            +   '<button type="button" class="cf-del" data-id="' + c.id + '">删除</button>'
            + '</div>'
            + '<p class="cf-item__text">' + escapeHtml(c.body).replace(/\n/g, '<br>') + '</p>'
            + '</div>';
        }).join('');
        Array.prototype.forEach.call(listEl.querySelectorAll('.cf-del'), function (b) {
          b.addEventListener('click', function () {
            var id = b.getAttribute('data-id');
            deleteComment(id);
          });
        });
      })
      .catch(function () { listEl.innerHTML = '<p class="cf-empty">留言载入失败，请刷新重试。</p>'; });
  }

  // Turnstile
  window._cfTurnstileToken = '';
  function renderTurnstile() {
    if (!window.turnstile || typeof window.turnstile.render !== 'function') {
      setTimeout(renderTurnstile, 300); return;
    }
    window.turnstile.render('#cf-turnstile', {
      sitekey: TURNSTILE_SITE_KEY,
      callback: function (t) { window._cfTurnstileToken = t; },
      'expired-callback': function () { window._cfTurnstileToken = ''; },
      'error-callback': function () { window._cfTurnstileToken = ''; }
    });
  }
  renderTurnstile();

  // 提交
  formEl.addEventListener('submit', function (e) {
    e.preventDefault();
    var body = bodyEl.value.trim();
    if (!body) { showMsg('请先写下点什么', 'err'); return; }
    showMsg('发布中…', '');

    fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        slug: slug,
        author: authorEl.value.trim() || '匿名',
        body: body,
        'cf-turnstile-response': window._cfTurnstileToken || ''
      })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (res.ok && res.d.ok) {
          bodyEl.value = '';
          window._cfTurnstileToken = '';
          if (window.turnstile) window.turnstile.reset();
          showMsg('已发布 ✓', 'ok');
          setTimeout(function () { showMsg('', ''); }, 2500);
          loadComments();
        } else {
          showMsg(res.d.error || '发布失败，请重试', 'err');
          if (window.turnstile) window.turnstile.reset();
        }
      })
      .catch(function () { showMsg('网络异常，请稍后重试', 'err'); });
  });

  // GitHub 轻量登录
  if (GH_CLIENT_ID !== 'YOUR_GITHUB_CLIENT_ID') {
    // 由 gh-callback 写入会话
    try {
      var saved = sessionStorage.getItem('cf_gh_user');
      if (saved) applyLogin(saved);
    } catch (e) {}
    loginOut.addEventListener('click', function () {
      try { sessionStorage.removeItem('cf_gh_user'); } catch (e) {}
      loginBox.hidden = true;
      authorEl.value = '';
    });
    // 触发登录入口：在标题旁加一个细按钮（仅配了 client id 时）
    var head = document.querySelector('.cf-comments__head h3');
    if (head) {
      var gh = document.createElement('button');
      gh.type = 'button'; gh.textContent = 'GitHub 登录';
      gh.style.cssText = 'float:right;background:none;border:1px solid var(--border);'
        + 'color:var(--secondary);font-size:.78rem;padding:.25rem .7rem;border-radius:999px;cursor:pointer;';
      gh.addEventListener('click', function () {
        var url = 'https://github.com/login/oauth/authorize?client_id=' + GH_CLIENT_ID
          + '&redirect_uri=' + encodeURIComponent(location.origin + '/gh-callback.html')
          + '&scope=read:user';
        window.open(url, 'ghlogin', 'width=600,height=700');
      });
      head.appendChild(gh);
    }
  }
  function applyLogin(name) {
    loginBox.hidden = false;
    loginName.textContent = name;
    authorEl.value = name;
  }
  window.addEventListener('message', function (ev) {
    if (ev.origin !== location.origin) return;
    if (ev.data && ev.data.ghUser) {
      try { sessionStorage.setItem('cf_gh_user', ev.data.ghUser); } catch (e) {}
      applyLogin(ev.data.ghUser);
    }
  });

  loadComments();
})();
</script>
