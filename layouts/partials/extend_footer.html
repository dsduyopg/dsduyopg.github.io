{{- if not site.Params.disableBusuanzi }}
<div class="busuanzi">
  本站访客 <span id="busuanzi_value_site_uv"></span> ·
  访问量 <span id="busuanzi_value_site_pv"></span>
  {{- if eq .Kind "page" }} · 本文阅读 <span id="busuanzi_value_page_pv"></span>{{- end }}
</div>
{{- end }}

<!-- Cloudflare Web Analytics -->
<script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "REPLACE_WITH_YOUR_TOKEN"}'></script>

<script>
  (function () {
    var keyViews = 'blog_views';
    var keyTitles = 'blog_titles';
    var isArticle = !!document.querySelector('.post-single');
    var hotEl = document.getElementById('hot-posts');

    if (isArticle) {
      var path = location.pathname;
      var title = (document.title || '').replace(/\s*\|.*$/, '').trim();
      if (!path || !title) return;
      var views = JSON.parse(localStorage.getItem(keyViews) || '{}');
      var titles = JSON.parse(localStorage.getItem(keyTitles) || '{}');
      views[path] = (views[path] || 0) + 1;
      titles[path] = title;
      localStorage.setItem(keyViews, JSON.stringify(views));
      localStorage.setItem(keyTitles, JSON.stringify(titles));
      return;
    }

    if (!hotEl) return;
    if (hotEl.children.length) return; // 已有服务端渲染的默认列表，不再用本地记录覆盖
    var views = JSON.parse(localStorage.getItem(keyViews) || '{}');
    var titles = JSON.parse(localStorage.getItem(keyTitles) || '{}');
    var rows = Object.keys(views)
      .filter(function (p) {
        return p.indexOf('/posts/') === 0
          && p.indexOf('/page/') === -1
          && titles[p]
          && titles[p] !== '我的博客';
      })
      .sort(function (a, b) { return views[b] - views[a]; })
      .slice(0, 5);
    if (!rows.length) return;

    var html = '<h3>热门文章</h3><ol class="hot-list">';
    rows.forEach(function (p) {
      html += '<li><a href="' + p + '">' + titles[p] + '</a></li>';
    });
    html += '</ol>';
    hotEl.innerHTML = html;
  })();
</script>
