name = "blog-comments"
main = "worker.js"
compatibility_date = "2024-09-23"

# D1 数据库绑定（部署前需先创建：wrangler d1 create blog-comments-db）
[[d1_databases]]
binding = "DB"
database_name = "blog-comments-db"
database_id = "ef9fe6b5-6194-45d1-96c5-9d90001e9c17"

# KV 命名空间绑定（频率限制用，部署前需先创建：wrangler kv namespace create blog-comments-kv）
[[kv_namespaces]]
binding = "KV"
id = "b32c0812c5744777a835d2d17ce5e197"

# 环境变量（部署前请先通过 `wrangler secret put ADMIN_TOKEN` 设置为你的管理员密码，
# 这里仅作占位，正式部署请用 secret 覆盖，避免密码明文留在文件里）
[vars]
TURNSTALL_SECRET = "0x4AAAAAAEbQytqXnhBr4EwLSrmgfHwCrqc"
ADMIN_TOKEN = "changeme-admin-token"
