baseURL = 'https://dsduyopg-github-io.pages.dev/'
locale = 'zh-cn'
title = 'My_blog'
theme = 'PaperMod'
defaultContentLanguage = 'zh-cn'
enableEmoji = true
enableRobotsTXT = true

[params]
  env = 'production'
  mainSections = ['posts', '专栏', '草稿箱']
  math = true
  disableSpecial1stPost = true
  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowToc = true
  ShowPostNavLinks = true
  ShowRssButtonInSectionTermList = true
  ShowAllPagesInArchive = false
  hideSummary = false

  [params.search]
    enable = true
    placeholder = "🔍 搜索文章…"

  [params.profileMode]
    enabled = false

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[[menu.main]]
  identifier = "home"
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 3
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 4
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 5
  [[menu.main]]
    identifier = "columns"
    name = "专栏"
    url = "/专栏/"
    weight = 6
  [[menu.main]]
    identifier = "draftbox"
    name = "草稿箱"
    url = "/草稿箱/"
    weight = 7

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
