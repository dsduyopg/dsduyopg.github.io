baseURL = 'https://dsduyopg.github.io/'
locale = 'zh-cn'
title = '我的博客'
theme = 'PaperMod'
defaultContentLanguage = 'zh-cn'
paginate = 9
enableEmoji = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = 'production'
  description = '记录 Linux、运维、自动化和我自己折腾过的项目'
  keywords = ['Linux', '运维', '自动化', 'Python', 'Teldrive', '博客']
  author = 'dsduyopg'
  mainSections = ['posts']
  ShowReadingTime = true
  ShowWordCount = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowToc = true
  TocOpen = false
  ShowPostNavLinks = true
  ShowShareButtons = false
  ShowRssButtonInSectionTermList = true
  disableSpecial1stPost = true
  math = true

  [params.homeInfoParams]
    Title = '欢迎来到我的博客'
    Content = '记录 Linux、运维、自动化，还有我自己折腾过的项目。这里会持续更新。'
    AlignSocialIconsTo = 'left'

[[params.socialIcons]]
name = 'github'
url = 'https://github.com/dsduyopg'

[[menu.main]]
name = "搜索"
url = "/search/"
weight = 1

[[menu.main]]
name = "归档"
url = "/archives/"
weight = 2

[[menu.main]]
name = "标签"
url = "/tags/"
weight = 3

[[menu.main]]
name = "关于"
url = "/about/"
weight = 4

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
